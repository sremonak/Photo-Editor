name: Build & Publish LumaCraft Photo Studio (Signed Release APK)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Assemble, Sign, Verify & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK + Debug APK
        run: |
          set -o pipefail
          gradle clean assembleRelease assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Report Compile Errors As Commit Comment (failure diagnostics)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "LumaCraft build failure diagnostics — commit ${{ github.sha }}"
            echo '```'
            grep -E "^e: |error: |Execution failed for task" build_output.log | head -60 || true
            echo '```'
          } > diag.md
          gh api repos/"${{ github.repository }}"/commits/"${{ github.sha }}"/comments -f body="$(cat diag.md)" || true

      - name: Verify APK Signature & Identity
        run: |
          APK=$(ls app/build/outputs/apk/release/app-universal-release.apk)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -n1)
          echo "=== apksigner verify (universal) ==="
          $APKSIGNER verify --print-certs "$APK"
          echo "=== package identity ==="
          $AAPT dump badging "$APK" | grep -E "^package:|^application-label:" || true

      - name: Prepare Release Assets (per-ABI + universal)
        run: |
          VNUM="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/LumaCraft-v${VNUM}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app/build/outputs/apk/release/app-${abi}-release.apk" ]; then
              cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/LumaCraft-v${VNUM}-${abi}.apk"
            fi
          done
          cp app/build/outputs/apk/debug/app-universal-debug.apk "dist/LumaCraft-v${VNUM}-debug-universal.apk" || true
          ls -la dist
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          {
            echo "## LumaCraft Photo Studio v1.0.${GITHUB_RUN_NUMBER}"
            echo ""
            echo "**In-place update:** install this APK directly over any previous LumaCraft release — same signing key (\`com.lumacraft.studio\`), no uninstall needed."
            echo ""
            echo "### Which APK to install?"
            echo "- 📱 **arm64-v8a** — most modern phones (recommended, ~3× smaller)"
            echo "- 📱 armeabi-v7a — older 32-bit devices"
            echo "- 📱 x86_64 — emulators / Intel-based devices"
            echo "- 📱 universal — works everywhere (largest)"
            echo "- 🛠 debug-universal — development build (install only one variant)"
            echo ""
            echo "### New in this line: .cube LUT import/export, painted selective masks, CameraX capture, auto white balance, copy/paste looks, per-ABI APKs"
            echo ""
            echo "### Verify checksum"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo ""
            echo "Privacy-first: no internet permission, 100% on-device processing. Monotonic versionCode ensures seamless updates."
          } > release_notes.md
          ASSETS=$(ls dist/*.apk dist/SHA256SUMS.txt)
          gh release create "$TAG" \
            --title "LumaCraft Photo Studio v1.0.${GITHUB_RUN_NUMBER}" \
            --notes-file release_notes.md \
            $ASSETS \
          || gh release upload "$TAG" $ASSETS --clobber

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaCraft-APKs-v1.0.${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
