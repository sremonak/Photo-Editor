name: Build & Publish LumaCraft Photo Studio (Signed Release APK)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Assemble, Sign, Verify & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK + Debug APK
        run: gradle clean assembleRelease assembleDebug --stacktrace

      - name: Verify APK Signature & Identity
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -n1)
          echo "=== apksigner verify ==="
          $APKSIGNER verify --print-certs "$APK"
          echo "=== package identity ==="
          $AAPT dump badging "$APK" | grep -E "^package:|^application-label:" || true

      - name: Prepare Release Assets
        run: |
          VNUM="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/LumaCraft-v${VNUM}-release.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/LumaCraft-v${VNUM}-debug.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          {
            echo "## LumaCraft Photo Studio v1.0.${GITHUB_RUN_NUMBER}"
            echo ""
            echo "**In-place update:** install this APK directly over any previous LumaCraft release — same signing key (\`com.lumacraft.studio\`), no uninstall needed."
            echo ""
            echo "### Install"
            echo "- 📱 **LumaCraft-v1.0.${GITHUB_RUN_NUMBER}-release.apk** — recommended (optimized, R8-shrunk)"
            echo "- 🛠 LumaCraft-v1.0.${GITHUB_RUN_NUMBER}-debug.apk — development build (install only one variant)"
            echo ""
            echo "### Verify checksum"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo ""
            echo "Privacy-first: no internet permission, 100% on-device processing. Monotonic versionCode ensures seamless updates."
          } > release_notes.md
          gh release create "$TAG" \
            --title "LumaCraft Photo Studio v1.0.${GITHUB_RUN_NUMBER}" \
            --notes-file release_notes.md \
            dist/LumaCraft-v1.0.${GITHUB_RUN_NUMBER}-release.apk \
            dist/LumaCraft-v1.0.${GITHUB_RUN_NUMBER}-debug.apk \
            dist/SHA256SUMS.txt \
          || gh release upload "$TAG" dist/LumaCraft-v1.0.${GITHUB_RUN_NUMBER}-release.apk dist/LumaCraft-v1.0.${GITHUB_RUN_NUMBER}-debug.apk dist/SHA256SUMS.txt --clobber

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaCraft-APKs-v1.0.${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
